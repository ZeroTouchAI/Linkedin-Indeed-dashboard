name: Refresh data and deploy

on:
  schedule:
    # UTC. The Make scrapers run at 8:00 (Indeed) and 9:00 (LinkedIn) Toronto time,
    # so these land ~1-2h after, mid-afternoon, and evening. GitHub may fire them late.
    - cron: '0 14 * * *'
    - cron: '0 17 * * *'
    - cron: '0 22 * * *'
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install google-auth google-api-python-client

      - name: Rebuild data.json from the Google Sheet (last 30 days)
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.JOBS_SHEET_ID }}
          DAYS: '30'
        run: python scripts/refresh_data.py

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html data.json _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
